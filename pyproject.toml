[tool.poetry]
name = "ragpi"
version = "0.1.0"
description = ""
authors = []
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = { extras = ["standard"], version = "^0.139.2" }
html2text = "^2025.4.15"
openai = "^2.48.0"
redis = "^7.4.1"
celery = "^5.6.3"
redisvl = "^0.23.0"
beautifulsoup4 = "^4.15.0"
pydantic-settings = "^2.14.2"
lxml = "^6.1.1"
pydantic = "^2.13.4"
aiohttp = "^3.14.3"
langchain-text-splitters = "^1.1.2"
tiktoken = "^0.13.0"
watchfiles = "^1.2.0"
numpy = "^2.3.3"
opentelemetry-api = "^1.44.0"
opentelemetry-sdk = "^1.44.0"
opentelemetry-exporter-otlp-proto-http = "^1.44.0"
opentelemetry-instrumentation = "^0.65b0"
opentelemetry-instrumentation-openai = "^0.62.1"
opentelemetry-instrumentation-fastapi = "^0.65b0"
pgvector = "^0.5.0"
sqlalchemy-utils = "^0.42.1"
psycopg2-binary = "^2.9.12"
sqlalchemy = "^2.0.51"
pypdf = "^6.14.2"


[tool.poetry.group.dev.dependencies]
celery-types = "^0.26.0"
types-beautifulsoup4 = "^4.12.0.20250516"
pre-commit = "^4.6.1"
flower = "^2.0.1"
pytest = "^9.1.1"
pytest-mock = "^3.15.1"
pytest-asyncio = "^1.4.0"
testcontainers = "^4.14.2"
ruff = "^0.16.0"
mypy = "^2.3.0"

[tool.mypy]
plugins = ['pydantic.mypy']

[tool.ruff.lint]
# Preserve pre-0.16 default rule set (Ruff 0.16 expanded defaults to 413 rules).
# Adopt additional rules deliberately rather than all at once.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = 'auto'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
